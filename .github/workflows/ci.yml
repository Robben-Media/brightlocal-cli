name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run fmt-check
        run: make fmt-check

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build (CGO enabled for keyring)
        run: CGO_ENABLED=1 go build -o bin/brightlocal-cli ./cmd/brightlocal

      - name: Probe native macOS empty-keyring status
        timeout-minutes: 1
        shell: bash
        env:
          BRIGHTLOCAL_CLI_KEYRING_BACKEND: keychain
        run: |
          ./bin/brightlocal-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is False and s["env_override"] is False'

      - name: Test headless encrypted credential storage
        timeout-minutes: 1
        shell: bash
        env:
          BRIGHTLOCAL_CLI_KEYRING_BACKEND: file
          BRIGHTLOCAL_CLI_KEYRING_PASS: ci-only-dummy-password
        run: |
          echo "testkey" | ./bin/brightlocal-cli auth set-key --stdin
          ./bin/brightlocal-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is True and s["env_override"] is False'
          ./bin/brightlocal-cli auth remove
          ./bin/brightlocal-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is False and s["env_override"] is False'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/brightlocal-cli.exe ./cmd/brightlocal

      - name: Test keyring
        run: |
          "testkey" | .\bin\brightlocal-cli.exe auth set-key --stdin
          .\bin\brightlocal-cli.exe auth status
